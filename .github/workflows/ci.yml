name: ci
on:
  push:
    branches: [main]
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # package.json pins the whole dsh family to 0.2.0-rc.1 (upstream `next`).
        # That line is the one 0.8.0 is declared against: it keeps the 0.1.7
        # settings seam (a form per loader entry, no `settings.get`) and the
        # process-wide agent composition, and it pins the family's roots to the
        # same cordis 4.0.4 / include 1.0.9 / loader 1.0.5 / timer 1.1.6 set, so
        # one roots table serves both lines. The default leg and the Windows leg
        # install the committed manifest unchanged; every other leg rewrites it
        # with `scripts/ci-pin-line.mjs` and deletes the lock, because the
        # committed lock belongs to the default line.
        #
        # Every version we declare stays covered, at the depth its risk deserves:
        # the default (0.2.0-rc.2) and 0.1.7-rc.2 run the full probe set, while
        # 0.2.0-rc.1 and 0.1.7-rc.1 — same generation as their newer sibling, and
        # the rc.1s are only declared because they were run — keep typecheck plus
        # the suite. rc.2 became the default when upstream pointed *both*
        # `latest` and `next` at it: it is the baseline the desktop harness
        # ships, so it is what a fresh user resolves.
        #
        # 0.1.7-rc.2 keeps a full leg because the line is still declared:
        # still declared compatible, and 59 of its 272 packages changed their type
        # surface against rc.1, so both rcs stay covered. Its one wrinkle is that
        # the family never published dsh-llm-mock-server on that line, so the pin
        # script keeps that devDep at rc.1 (a standalone HTTP mock with no family
        # peer); without it the host-contract case and the busy-drop probe cannot
        # run at all.
        #
        # The 0.1.5 line is *dropped* in 0.8.0 (see dshReleases: its releases are
        # `incompatible` now, and the range no longer admits them). Its two legs
        # are gone with it, the plural `dsh-agent-presets` package is no longer
        # declared anywhere, and the `--legacy-peer-deps` install step that only
        # that line needed is gone too — 0.1.5 resolved its peers through caret
        # ranges that a fresh install no longer satisfies.
        #
        # Pinning a leg to an older rc *within* a line does not resolve when that
        # rc peer-ranges a sibling the family later re-pinned, so each line keeps
        # the newest rc of that generation it can install cleanly, plus the rs
        # upstream still points a dist-tag at.
        dsh: ["0.2.0-rc.2", "0.2.0-rc.1", "0.1.7-rc.2", "0.1.7-rc.1"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # One rewrite for every non-default line. It replaces two inline node -e
      # heredocs: the version substitution was readable, but the presets split, the
      # family's root pins and the override map were not, and a typo in one of them
      # only showed up as a red leg twenty minutes later. The script is a pure
      # function with a test, and it is runnable locally:
      #   node scripts/ci-pin-line.mjs 0.1.7-rc.2
      - name: Pin the tree to the dsh ${{ matrix.dsh }} line
        if: matrix.dsh != '0.2.0-rc.2'
        run: |
          node scripts/ci-pin-line.mjs ${{ matrix.dsh }}
          rm -f package-lock.json
      - name: Install
        run: npm install --no-audit --no-fund
      # Peer resolution stays *on* for every leg: `scripts/ci-pin-line.mjs` pins
      # the whole family through `overrides` instead of asking npm to skip peers.
      # `--legacy-peer-deps` was used by the 0.1.5-rc.1 leg, and the tree it
      # produced was missing 37 peer-only packages — the probes on that leg could
      # not reach a model.
      - run: npx tsc -p tsconfig.json --noEmit
      # The TAP stream is kept on disk so a red run can annotate *which* test
      # failed: the checks UI otherwise shows only "exit code 1".
      - run: node --test --test-reporter=tap --test-reporter-destination=test-output.txt --test-reporter=spec --test-reporter-destination=stdout "tests/*.test.mjs"
      - name: Annotate the failing tests
        if: failure()
        run: node scripts/ci-annotate-failures.mjs test-output.txt
      # The static half of the B2 freeze (docs/plans/b2-architecture-plan.md): the
      # representation invariants (unclassified / unknown destination / live source
      # rows / duplicate primaries) and the retired legacy paths, as one command.
      # The behavioural half is the suite above; a deleted path leaves no runtime
      # signature, so "it is gone" needs a check the suite cannot be.
      - name: B2 freeze audit (representation invariants + retired paths)
        run: npm run freeze
      # End to end on a real PTY, against a profile this repo builds for itself:
      # a headless runner has no ~/.dsh, which is why this never ran here before.
      - name: End-to-end PTY probe (throwaway profile)
        run: |
          npm install -g pnpm@10 --no-audit --no-fund
          node scripts/probe-home.mjs --probe
      - name: Terminal-capability probe
        run: node scripts/probe-home.mjs --probe --script tui-term-probe.mjs
      # The desktop shape: no PTY anywhere. A parent that puts bytes on a pipe (a
      # PTY panel, an embedder's own terminal widget, a GUI that shells out) hosts
      # the TUI by declaring `DSH_TUI_DISPLAY=stdio`; this boots the same
      # throwaway profile with pipes and checks that it paints, takes a
      # keystroke, repaints when the parent reports a new size
      # (`CSI 8 ; rows ; cols t`, since a pipe fires no `resize`), and exits
      # cleanly. It is also the only probe that would run on a machine with no
      # terminal at all, which is why it runs on both legs.
      - name: Stdio pipe probe (no PTY, desktop shape)
        run: node scripts/probe-home.mjs --probe --script tui-stdio-probe.mjs
      # "Is a window really on this session?" is a question the lock cannot
      # answer: a cut SSH link leaves the launcher connected for as long as sshd
      # takes to notice. This drives the real PTY, answers the relay's cursor
      # probes, then stops — the cut-link shape, with every process still alive —
      # and asserts the Host's answer follows. One leg is enough: the frames and
      # the probe round trip are host-line independent, and the probe skips
      # itself when node-pty is missing.
      - name: Cut-link liveness probe
        if: matrix.dsh == '0.2.0-rc.2'
        run: node scripts/probe-home.mjs --probe --script tui-cut-probe.mjs
      # The link is measured at attach *and* re-measured afterwards, because one
      # measurement taken while the session was booting used to decide the footer
      # chip — and the paint cadence with it — for the whole session: a red chip
      # that never recovered. This plays a terminal that is slow for the first
      # seconds and fast afterwards and reads the chip out of the real PTY.
      - name: Link-quality probe
        if: matrix.dsh == '0.2.0-rc.2'
        run: node scripts/probe-home.mjs --probe --script tui-rtt-probe.mjs
      # The link chip with nothing measured — the shape the field reported twice
      # (`SSH ○○○○ 160ms`, where 160ms was the paint cadence, not a latency). A
      # PTY cannot play that terminal on Windows (ConPTY answers `CSI 6n` itself),
      # and no pty is needed anyway: the parent *is* the terminal here, so it can
      # simply stay silent. Runs on both legs.
      - name: Unmeasured link-chip probe (pipe parent)
        run: node scripts/probe-home.mjs --probe --script tui-unmeasured-probe.mjs
      # The keep-alive promise, mid-turn: the window closes (SIGHUP here) and the
      # Host has to outlive it so the running turn is not lost. The same probe
      # runs on the Windows leg, where the window close is a ConPTY teardown.
      #
      # It runs on every leg whose install is complete: a
      # `--legacy-peer-deps` tree left the DeepSeek adapter fiberless
      # (`no adapter registered for provider "deepseek-official"`), which was an
      # install defect, not a probe one.
      - name: Busy-drop probe (window closed mid-turn)
        run: node scripts/tui-mock-probe.mjs --busy
      # The status row on an ASCII console. The footer pass' meters are the newest
      # place a UTF-8 cell could leak into a terminal that cannot decode one, and
      # the probe asserts the row's glyph set over a real PTY.
      - name: Terminal-capability probe (ASCII console)
        run: DSH_TUI_ASCII=1 node scripts/probe-home.mjs --probe --script tui-term-probe.mjs
      # The other half of that script: a scripted turn, then the copy paths a
      # reader actually takes — `/find` highlights the match, a drag over the
      # reply copies exactly what it covered, and the copy key takes the
      # *selected* reply as written (its `▶` marker is chrome, not text). The
      # mouse reports come from the probe rebuilding the screen, so this is also
      # where the marker's cell accounting is pinned. One leg: it needs the mock
      # model, and the frames it asserts are host-line independent.
      - name: Reply copy probe (scripted turn)
        if: matrix.dsh == '0.2.0-rc.2'
        run: node scripts/tui-mock-probe.mjs
  # The display channel is an AF_UNIX socket on POSIX but a \\.\pipe\ named
  # pipe on Windows (fs.access() cannot see pipes), so the Windows startup
  # path only gets real coverage on a Windows runner.
  test-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - run: npx tsc -p tsconfig.json --noEmit
      # Node expands the quoted glob itself: PowerShell does not glob for
      # native commands, and this keeps the step identical on both shells.
      - run: node --test --test-reporter=tap --test-reporter-destination=test-output.txt --test-reporter=spec --test-reporter-destination=stdout "tests/*.test.mjs"
      - name: Annotate the failing tests
        if: failure()
        run: node scripts/ci-annotate-failures.mjs test-output.txt
      - name: B2 freeze audit (representation invariants + retired paths)
        run: npm run freeze

      # Windows is where "it worked on Linux" stopped being evidence: this drives
      # the real TUI in a ConPTY on a real Windows host, so a lifecycle that only
      # holds on POSIX fails here instead of on a user's desktop.
      - name: End-to-end PTY probe (ConPTY, throwaway profile)
        run: |
          npm install -g pnpm@10 --no-audit --no-fund
          node scripts/probe-home.mjs --probe
      - name: End-to-end drop/reattach probe (ConPTY)
        run: node scripts/probe-home.mjs --probe --script tui-drop-probe.mjs
      # "The Host keeps running when you close the window" used to be a claim
      # verified by hand on one desktop. Here the window is closed for real (a
      # ConPTY teardown, the closest thing Windows has to a hangup) while a turn
      # streams, and the Host's own console — the one `windowsHide` gives it — is
      # what has to keep it out of the console-close event.
      - name: Busy-drop probe (ConPTY window close)
        run: node scripts/tui-mock-probe.mjs --busy
      # The Windows-only terminal profiles (Windows Terminal, conhost) need a real
      # win32 platform, so this leg is the only one that can run them. The probe
      # also asserts the status row itself — its glyph set, its width, and that
      # the counters which left the default row really left it — in each console.
      - name: Terminal-capability probe (incl. Windows profiles)
        run: node scripts/probe-home.mjs --probe --script tui-term-probe.mjs
      # The footer pass' Windows matrix: every Windows terminal this project
      # supports, painted through the same capability functions the TUI calls.
      - name: Status-row capability matrix (Windows terminals)
        run: node scripts/footer-windows-probe.mjs
      # The desktop shape, on the platform whose desktop build is the one users
      # run: no PTY, no ConPTY, just pipes. Also the cheapest check that this
      # plugin's painting path is not quietly relying on a console — the desktop
      # launcher is an Electron-as-Node process with none.
      - name: Stdio pipe probe (no PTY, desktop shape)
        run: node scripts/probe-home.mjs --probe --script tui-stdio-probe.mjs
      # Windows is where the unmeasured chip is reachable at all: ConPTY answers
      # `CSI 6n` for the app, so the PTY probes see a measurement and cannot play
      # a silent terminal — the pipe parent can, and does, on this leg too.
      - name: Unmeasured link-chip probe (pipe parent)
        run: node scripts/probe-home.mjs --probe --script tui-unmeasured-probe.mjs
