name: ci
on:
  push:
    branches: [main]
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Dual-stack: package.json pins the newest verified host, 0.1.5-rc.1.
        # The older leg rewrites every @deepseek-ai/dsh-* devDependency and
        # resolves from scratch, so each leg installs one coherent host tree
        # instead of mixing versions (which needs no legacy-peer-deps).
        dsh: ["0.1.5-rc.1", "0.1.2-rc.1"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Pin @deepseek-ai/dsh-* devDependencies to ${{ matrix.dsh }}
        if: matrix.dsh != '0.1.5-rc.1'
        run: |
          node -e "
            const fs = require('node:fs');
            const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'));
            for (const name of Object.keys(pkg.devDependencies)) {
              if (name.startsWith('@deepseek-ai/dsh-')) pkg.devDependencies[name] = '${{ matrix.dsh }}';
            }
            fs.writeFileSync('package.json', JSON.stringify(pkg, null, 2) + '\n');
          "
          rm -f package-lock.json
      - run: npm install --no-audit --no-fund
      - run: npx tsc -p tsconfig.json --noEmit
      - run: node --test tests/*.test.mjs
