name: ci
on:
  push:
    branches: [main]
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # package.json pins the whole dsh family to 0.1.5-rc.2 (upstream `next`).
        # Pinning it to rc.1 does not resolve: several rc.1 packages peer-range
        # `^0.1.5-rc.2` siblings (dsh-storage-domain rc.2 wants dsh-invariants
        # rc.2), so npm nests a second @deepseek-ai/dsh-scope and the agent
        # runtime loads two module instances — `agent-presets` then refuses to
        # compose an unscoped context and the TUI never starts. One version for
        # the whole family keeps a single copy. 0.1.2-rc.1 stays as the oldest
        # supported stack; 0.1.5-rc.1 (npm `latest`) is still covered because
        # every non-default leg rewrites the @deepseek-ai/dsh-* devDependencies
        # and resolves from scratch.
        dsh: ["0.1.5-rc.2", "0.1.5-rc.1", "0.1.2-rc.1"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Pin @deepseek-ai/dsh host devDependencies to ${{ matrix.dsh }}
        if: matrix.dsh != '0.1.5-rc.2'
        run: |
          node -e "
            const fs = require('node:fs');
            const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'));
            // The CLI itself is '@deepseek-ai/dsh' (no trailing dash). Missing it
            // left every leg on the newest CLI: a caret prerelease range such as
            // '^0.1.5-rc.2' resolves to the 'latest' tag (rc.1), not to the
            // highest satisfying version — so the leg ran the wrong host.
            const hostPackage = name => name === '@deepseek-ai/dsh' || name.startsWith('@deepseek-ai/dsh-');
            for (const name of Object.keys(pkg.devDependencies)) {
              if (hostPackage(name)) pkg.devDependencies[name] = '${{ matrix.dsh }}';
            }
            fs.writeFileSync('package.json', JSON.stringify(pkg, null, 2) + '\n');
          "
          rm -f package-lock.json
      - run: npm install --no-audit --no-fund
      - run: npx tsc -p tsconfig.json --noEmit
      - run: node --test "tests/*.test.mjs"
  # The display channel is an AF_UNIX socket on POSIX but a \\.\pipe\ named
  # pipe on Windows (fs.access() cannot see pipes), so the Windows startup
  # path only gets real coverage on a Windows runner.
  test-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - run: npx tsc -p tsconfig.json --noEmit
      # Node expands the quoted glob itself: PowerShell does not glob for
      # native commands, and this keeps the step identical on both shells.
      - run: node --test "tests/*.test.mjs"
