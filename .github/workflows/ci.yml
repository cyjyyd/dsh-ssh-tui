name: ci
on:
  push:
    branches: [main]
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # package.json pins the whole dsh family to 0.1.5-rc.3 (upstream `next`).
        # rc.3 was run against the suite and both lifecycle probes before it was
        # declared compatible; the pinned family is what the default leg and the
        # Windows leg resolve, so the newest host is the one most exercised.
        # Pinning to rc.1 does not resolve: several rc.1 packages peer-range
        # `^0.1.5-rc.2` siblings (dsh-storage-domain rc.2 wants dsh-invariants
        # rc.2), so npm nests a second @deepseek-ai/dsh-scope and the agent
        # runtime loads two module instances — `agent-presets` then refuses to
        # compose an unscoped context and the TUI never starts. One version for
        # the whole family keeps a single copy. 0.1.2-rc.1 stays as the oldest
        # supported stack; 0.1.5-rc.1 is still covered because every non-default
        # leg rewrites the @deepseek-ai/dsh-* devDependencies and resolves from
        # scratch.
        #
        # rc.2 (`latest`) has no leg, deliberately. Upstream published rc.3 with
        # exact sibling pins; rc.2's caret ranges therefore resolve to a mixed
        # family in a fresh install now (peer @deepseek-ai/dsh-invariants@^0.1.5-rc.3
        # from dsh-storage-domain@0.1.5-rc.3 against a root pinned to rc.2) and npm
        # fails the install with ERESOLVE. Building that leg anyway needs
        # --legacy-peer-deps, which nests the duplicate module copies the comment
        # above exists to avoid — and rc.2's published API is identical to rc.3's
        # (all 31 packages diffed: 0 .d.ts changes, 0 member-level changes), so the
        # leg would assert nothing the rc.3 leg does not. `dshReleases` still
        # carries rc.2 as compatible: 0.7.2 shipped against it with CI green.
        # `next` is 0.1.7-rc.1 and gets its own leg: that line rewrote the
        # settings seam (no `settings.get`, no `installSection`), split the
        # plural presets package into `dsh-agent-preset` +
        # `dsh-agent-preset-registry`, and replaced the terminal preset roster
        # with a process-wide agent composition. The leg rewrites the manifest
        # itself — devDep pins, the presets substitution, the family's root pins
        # and the plugin's own peer window — so the code is verified before the
        # shipped `dsh.compatibility` declaration is widened.
        dsh: ["0.1.5-rc.3", "0.1.5-rc.1", "0.1.2-rc.1", "0.1.7-rc.1"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Pin @deepseek-ai/dsh host devDependencies to ${{ matrix.dsh }}
        if: matrix.dsh != '0.1.5-rc.3' && matrix.dsh != '0.1.7-rc.1'
        run: |
          node -e "
            const fs = require('node:fs');
            const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'));
            // The CLI itself is '@deepseek-ai/dsh' (no trailing dash). Missing it
            // left every leg on the newest CLI: a caret prerelease range such as
            // '^0.1.5-rc.2' resolves to the 'latest' tag (rc.1), not to the
            // highest satisfying version — so the leg ran the wrong host.
            const hostPackage = name => name === '@deepseek-ai/dsh' || name.startsWith('@deepseek-ai/dsh-');
            for (const name of Object.keys(pkg.devDependencies)) {
              if (hostPackage(name)) pkg.devDependencies[name] = '${{ matrix.dsh }}';
            }
            fs.writeFileSync('package.json', JSON.stringify(pkg, null, 2) + '\n');
          "
          rm -f package-lock.json
      # 0.1.7 needs more than a version substitution. The plural
      # `dsh-agent-presets` has no release on that line at all (npm fails with
      # ETARGET) and the family's own root pins moved, so this leg rewrites the
      # devDeps, swaps the presets package for its two successors and pins the
      # roots. The plugin's peer window is part of the committed manifest now
      # (0.1.7 is a declared, verified line), so nothing here rewrites it.
      - name: Pin the whole tree to the 0.1.7 line
        if: matrix.dsh == '0.1.7-rc.1'
        run: |
          node -e "
            const fs = require('node:fs');
            const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'));
            const line = '0.1.7-rc.1';
            delete pkg.devDependencies['@deepseek-ai/dsh-agent-presets'];
            const hostPackage = name => name === '@deepseek-ai/dsh' || name.startsWith('@deepseek-ai/dsh-');
            for (const name of Object.keys(pkg.devDependencies)) {
              if (hostPackage(name)) pkg.devDependencies[name] = line;
            }
            Object.assign(pkg.devDependencies, {
              '@deepseek-ai/dsh-agent-preset': line,
              '@deepseek-ai/dsh-agent-preset-registry': line,
              '@deepseek-ai/cordis': '4.0.4',
              '@deepseek-ai/cordis-plugin-include': '1.0.9',
              '@deepseek-ai/cordis-plugin-loader': '1.0.5',
              '@deepseek-ai/cordis-plugin-timer': '1.1.6',
              // `dsh-app-boot` peers on this one to compose the launcher tree,
              // and `--legacy-peer-deps` skips peers: without it the CLI cannot
              // even print its help (ERR_MODULE_NOT_FOUND), which is the first
              // thing the PTY-probe bootstrap asks it to do.
              '@deepseek-ai/cordis-plugin-group': '1.0.4',
            });
            fs.writeFileSync('package.json', JSON.stringify(pkg, null, 2) + '\n');
          "
          rm -f package-lock.json
      - name: Install
        if: matrix.dsh != '0.1.5-rc.1' && matrix.dsh != '0.1.7-rc.1'
        run: npm install --no-audit --no-fund
      # 0.1.5-rc.1 is npm `latest` and stays declared as supported, but its own
      # peer ranges do not resolve (that is why the family is pinned to rc.2
      # above): npm fights over dsh-invariants and gives up with ERESOLVE. This
      # leg installs with legacy peers, which skips them and nests a second
      # @deepseek-ai/dsh-scope. It covers typecheck and the plugin suite; the
      # host-contract test skips itself there (no host can boot from a tree
      # missing peers), while that contract and the roster composition are
      # covered on the rc.2 leg and by `scripts/tui-probe.mjs` on a real profile.
      #
      # 0.1.7-rc.1 needs the same flag for the other end of the family: several
      # `@deepseek-ai/dsh` dependencies still carry caret PRERELEASE ranges
      # (`^0.1.5-rc.3`), which npm resolves through the `latest` tag rather than
      # to the highest match — so a plain install pulls 0.1.5-rc.3 packages
      # (plural presets included) into a tree the leg just pinned to 0.1.7.
      # Skipping peer resolution keeps the devDep pins this leg set, which is
      # what it is here to typecheck; the PTY probes build their own profile
      # tree from the pinned family, so they are unaffected.
      - name: Install (legacy peers for the rc.1 and 0.1.7 lines)
        if: matrix.dsh == '0.1.5-rc.1' || matrix.dsh == '0.1.7-rc.1'
        run: npm install --no-audit --no-fund --legacy-peer-deps
      - run: npx tsc -p tsconfig.json --noEmit
      # The TAP stream is kept on disk so a red run can annotate *which* test
      # failed: the checks UI otherwise shows only "exit code 1".
      - run: node --test --test-reporter=tap --test-reporter-destination=test-output.txt --test-reporter=spec --test-reporter-destination=stdout "tests/*.test.mjs"
      - name: Annotate the failing tests
        if: failure()
        run: node scripts/ci-annotate-failures.mjs test-output.txt
      # End to end on a real PTY, against a profile this repo builds for itself:
      # a headless runner has no ~/.dsh, which is why this never ran here before.
      # The rc.1 legs skip it (their peer tree cannot boot a host).
      - name: End-to-end PTY probe (throwaway profile)
        if: matrix.dsh != '0.1.5-rc.1' && matrix.dsh != '0.1.2-rc.1'
        run: |
          npm install -g pnpm@10 --no-audit --no-fund
          node scripts/probe-home.mjs --probe
      - name: Terminal-capability probe
        if: matrix.dsh != '0.1.5-rc.1' && matrix.dsh != '0.1.2-rc.1'
        run: node scripts/probe-home.mjs --probe --script tui-term-probe.mjs
      # The keep-alive promise, mid-turn: the window closes (SIGHUP here) and the
      # Host has to outlive it so the running turn is not lost. The same probe
      # runs on the Windows leg, where the window close is a ConPTY teardown.
      - name: Busy-drop probe (window closed mid-turn)
        if: matrix.dsh != '0.1.5-rc.1' && matrix.dsh != '0.1.2-rc.1'
        run: node scripts/tui-mock-probe.mjs --busy
  # The display channel is an AF_UNIX socket on POSIX but a \\.\pipe\ named
  # pipe on Windows (fs.access() cannot see pipes), so the Windows startup
  # path only gets real coverage on a Windows runner.
  test-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - run: npx tsc -p tsconfig.json --noEmit
      # Node expands the quoted glob itself: PowerShell does not glob for
      # native commands, and this keeps the step identical on both shells.
      - run: node --test --test-reporter=tap --test-reporter-destination=test-output.txt --test-reporter=spec --test-reporter-destination=stdout "tests/*.test.mjs"
      - name: Annotate the failing tests
        if: failure()
        run: node scripts/ci-annotate-failures.mjs test-output.txt

      # Windows is where "it worked on Linux" stopped being evidence: this drives
      # the real TUI in a ConPTY on a real Windows host, so a lifecycle that only
      # holds on POSIX fails here instead of on a user's desktop.
      - name: End-to-end PTY probe (ConPTY, throwaway profile)
        run: |
          npm install -g pnpm@10 --no-audit --no-fund
          node scripts/probe-home.mjs --probe
      - name: End-to-end drop/reattach probe (ConPTY)
        run: node scripts/probe-home.mjs --probe --script tui-drop-probe.mjs
      # "The Host keeps running when you close the window" used to be a claim
      # verified by hand on one desktop. Here the window is closed for real (a
      # ConPTY teardown, the closest thing Windows has to a hangup) while a turn
      # streams, and the Host's own console — the one `windowsHide` gives it — is
      # what has to keep it out of the console-close event.
      - name: Busy-drop probe (ConPTY window close)
        run: node scripts/tui-mock-probe.mjs --busy
      # The Windows-only terminal profiles (Windows Terminal, conhost) need a real
      # win32 platform, so this leg is the only one that can run them.
      - name: Terminal-capability probe (incl. Windows profiles)
        run: node scripts/probe-home.mjs --probe --script tui-term-probe.mjs
