name: ci
on:
  push:
    branches: [main]
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # package.json pins the whole dsh family to 0.1.7-rc.1 (upstream `next`).
        # That line rewrote the settings seam (no `settings.get`, no
        # `installSection`), split the plural presets package into
        # `dsh-agent-preset` + `dsh-agent-preset-registry`, and replaced the
        # terminal preset roster with a process-wide agent composition, so it is
        # the line the plugin is developed against: it is what the default leg
        # and the Windows leg resolve, and the only leg that installs the
        # committed manifest unchanged. 0.1.7-rc.1 was run against the suite and
        # both lifecycle probes before it became the default pin.
        #
        # Every other leg rewrites the manifest with `scripts/ci-pin-line.mjs`
        # and deletes the lock, because the committed one belongs to the default
        # line. The script holds the per-line root pins, the presets substitution
        # and the `overrides` map that keeps the transitive family on one version;
        # tests/ci-pin-line.test.mjs pins each rewrite, and the 0.1.5 rewrite must
        # reproduce, byte for byte, the manifest this repository used to commit.
        #
        # Pinning a leg to rc.1 does not resolve: several rc.1 packages
        # peer-range `^0.1.5-rc.2` siblings (dsh-storage-domain rc.2 wants
        # dsh-invariants rc.2), so npm nests a second @deepseek-ai/dsh-scope and
        # the agent runtime loads two module instances — `agent-presets` then
        # refuses to compose an unscoped context and the TUI never starts. One
        # version for the whole family keeps a single copy.
        #
        # 0.1.5-rc.3 is npm `latest` and the line most users are on, so it keeps
        # a full leg (install, suite, PTY probes). 0.1.5-rc.1 is the oldest
        # supported stack: 0.1.2-rc.1 was dropped once the 0.1.7 line was
        # verified, because the shims its API generation needed cost more than
        # the users it kept while 0.1.5-rc.1 covers that same generation.
        #
        # rc.2 has no leg, deliberately. Upstream published rc.3 with exact
        # sibling pins; rc.2's caret ranges therefore resolve to a mixed family
        # in a fresh install now (peer @deepseek-ai/dsh-invariants@^0.1.5-rc.3
        # from dsh-storage-domain@0.1.5-rc.3 against a root pinned to rc.2) and
        # npm fails the install with ERESOLVE. Building that leg anyway needs
        # --legacy-peer-deps, which nests the duplicate module copies the comment
        # above exists to avoid — and rc.2's published API is identical to rc.3's
        # (all 31 packages diffed: 0 .d.ts changes, 0 member-level changes), so
        # the leg would assert nothing the rc.3 leg does not. `dshReleases` still
        # carries rc.2 as compatible: 0.7.2 shipped against it with CI green.
        #
        # Upstream `next` has since moved to 0.1.7-rc.2. The shipped
        # dsh.compatibility window (`>=0.1.7-rc.1 <0.1.8`) admits it, but no leg
        # has run it: moving this leg's pin to rc.2 is what verifies it.
        dsh: ["0.1.5-rc.3", "0.1.5-rc.1", "0.1.7-rc.1"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # One rewrite for every non-default line. It replaces two inline node -e
      # heredocs: the version substitution was readable, but the presets split, the
      # family's root pins and the override map were not, and a typo in one of them
      # only showed up as a red leg twenty minutes later. The script is a pure
      # function with a test, and it is runnable locally:
      #   node scripts/ci-pin-line.mjs 0.1.5-rc.3
      - name: Pin the tree to the dsh ${{ matrix.dsh }} line
        if: matrix.dsh != '0.1.7-rc.1'
        run: |
          node scripts/ci-pin-line.mjs ${{ matrix.dsh }}
          rm -f package-lock.json
      - name: Install
        if: matrix.dsh != '0.1.5-rc.1'
        run: npm install --no-audit --no-fund
      # 0.1.5-rc.1 is the oldest supported stack and stays declared, but its own
      # peer ranges do not resolve (that is why the default line pins the whole
      # family): npm fights over dsh-invariants and gives up with ERESOLVE. This
      # leg installs with legacy peers, which skips them and nests a second
      # @deepseek-ai/dsh-scope. It covers typecheck and the plugin suite; the
      # host-contract test skips itself there (no host can boot from a tree
      # missing peers), while that contract and the roster composition are
      # covered on the other two legs and by `scripts/tui-probe.mjs` on a real
      # profile.
      #
      # The 0.1.7 legs do *not* use this flag: `scripts/ci-pin-line.mjs` pins the
      # whole family through `overrides` instead, which keeps peer resolution
      # on. The flag used to be there too, and the tree it produced was missing
      # 37 peer-only packages — the probes on that leg could not reach a model.
      - name: Install (legacy peers for the rc.1 line)
        if: matrix.dsh == '0.1.5-rc.1'
        run: npm install --no-audit --no-fund --legacy-peer-deps
      - run: npx tsc -p tsconfig.json --noEmit
      # The TAP stream is kept on disk so a red run can annotate *which* test
      # failed: the checks UI otherwise shows only "exit code 1".
      - run: node --test --test-reporter=tap --test-reporter-destination=test-output.txt --test-reporter=spec --test-reporter-destination=stdout "tests/*.test.mjs"
      - name: Annotate the failing tests
        if: failure()
        run: node scripts/ci-annotate-failures.mjs test-output.txt
      # End to end on a real PTY, against a profile this repo builds for itself:
      # a headless runner has no ~/.dsh, which is why this never ran here before.
      # The rc.1 leg skips it (its peer tree cannot boot a host).
      - name: End-to-end PTY probe (throwaway profile)
        if: matrix.dsh != '0.1.5-rc.1'
        run: |
          npm install -g pnpm@10 --no-audit --no-fund
          node scripts/probe-home.mjs --probe
      - name: Terminal-capability probe
        if: matrix.dsh != '0.1.5-rc.1'
        run: node scripts/probe-home.mjs --probe --script tui-term-probe.mjs
      # The keep-alive promise, mid-turn: the window closes (SIGHUP here) and the
      # Host has to outlive it so the running turn is not lost. The same probe
      # runs on the Windows leg, where the window close is a ConPTY teardown.
      #
      # It runs on every leg whose install is complete: a
      # `--legacy-peer-deps` tree left the DeepSeek adapter fiberless
      # (`no adapter registered for provider "deepseek-official"`), which was an
      # install defect, not a probe one.
      - name: Busy-drop probe (window closed mid-turn)
        if: matrix.dsh != '0.1.5-rc.1'
        run: node scripts/tui-mock-probe.mjs --busy
  # The display channel is an AF_UNIX socket on POSIX but a \\.\pipe\ named
  # pipe on Windows (fs.access() cannot see pipes), so the Windows startup
  # path only gets real coverage on a Windows runner.
  test-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - run: npx tsc -p tsconfig.json --noEmit
      # Node expands the quoted glob itself: PowerShell does not glob for
      # native commands, and this keeps the step identical on both shells.
      - run: node --test --test-reporter=tap --test-reporter-destination=test-output.txt --test-reporter=spec --test-reporter-destination=stdout "tests/*.test.mjs"
      - name: Annotate the failing tests
        if: failure()
        run: node scripts/ci-annotate-failures.mjs test-output.txt

      # Windows is where "it worked on Linux" stopped being evidence: this drives
      # the real TUI in a ConPTY on a real Windows host, so a lifecycle that only
      # holds on POSIX fails here instead of on a user's desktop.
      - name: End-to-end PTY probe (ConPTY, throwaway profile)
        run: |
          npm install -g pnpm@10 --no-audit --no-fund
          node scripts/probe-home.mjs --probe
      - name: End-to-end drop/reattach probe (ConPTY)
        run: node scripts/probe-home.mjs --probe --script tui-drop-probe.mjs
      # "The Host keeps running when you close the window" used to be a claim
      # verified by hand on one desktop. Here the window is closed for real (a
      # ConPTY teardown, the closest thing Windows has to a hangup) while a turn
      # streams, and the Host's own console — the one `windowsHide` gives it — is
      # what has to keep it out of the console-close event.
      - name: Busy-drop probe (ConPTY window close)
        run: node scripts/tui-mock-probe.mjs --busy
      # The Windows-only terminal profiles (Windows Terminal, conhost) need a real
      # win32 platform, so this leg is the only one that can run them.
      - name: Terminal-capability probe (incl. Windows profiles)
        run: node scripts/probe-home.mjs --probe --script tui-term-probe.mjs
