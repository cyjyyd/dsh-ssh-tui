# dsh-ssh-tui — SSH-friendly interactive terminal mode over dsh-base.
#
# DSH STORE requires an additive Bundle Patch: unique plugin-owned entry IDs
# only, no @deepseek-ai/* names, and no disable/replace of official rows.
# Persona, HMR, tools-mode, DeepSeek thinking, and subagent defaults stay with
# the profile / dsh-base composition; this patch only mounts the TUI.

- insert:
    - id: ssh-tui-startup
      name: 'dsh-ssh-tui/startup'

    # The TUI renders exactly the agent the agent-loop row bound, so it reads
    # the same startup-owned identity rather than restating one.
    - id: ssh-tui
      name: 'dsh-ssh-tui'
      inject: [sshTuiStartup]
      config:
        sessionId: !!js ctx.sshTuiStartup.sessionId
        resume: !!js ctx.sshTuiStartup.resume
        resumePicker: !!js ctx.sshTuiStartup.resumePicker
        provider: !!js ctx.sshTuiStartup.provider
        model: !!js ctx.sshTuiStartup.model
        showReasoning: true
        maxToolOutputLines: 6
        color: !!js ctx.sshTuiStartup.noColor !== true
        # Jump-host SSH: coalesce token ticks into one stdout write per frame.
        paintIntervalMs: !!js Number.parseInt(process.env.DSH_TUI_PAINT_MS ?? '160', 10) || 160
